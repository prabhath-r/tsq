[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tsq-learning"
version = "0.1.0"
description = "An explainable knowledge-graph adaptive learning engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
authors = [{ name = "The Second Question contributors" }]
dependencies = []

[project.scripts]
tsq = "tsq.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tsq.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
